<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">管理 AI 員工，先看懂四張資料卡</title><desc id="desc">概念圖解：能力、資料量、桌面容量與工作額度分開看。</desc><rect width="1200" height="460" rx="24" fill="#edf1e6"/><text x="48" y="65" font-family="sans-serif" font-weight="700" font-size="32" fill="#20342f">管理 AI 員工，先看懂四張資料卡</text><text x="48" y="108" font-family="sans-serif" font-size="22" fill="#5b6860">概念圖解：能力、資料量、桌面容量與工作額度分開看。</text><rect x="48" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="83" cy="188" r="20" fill="#294d3e"/><text x="83" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">1</text><text x="68" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">能力卡｜模型</text><text x="68" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">選擇合適的專長</text><text x="68" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">例行工作：快速模型</text><text x="68" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">難題：較強推理模型</text><path d="M307 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="333" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="368" cy="188" r="20" fill="#294d3e"/><text x="368" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">2</text><text x="353" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">資料單｜Token</text><text x="353" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">讀入、寫出的資料量</text><text x="353" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">不是一字或一分鐘</text><text x="353" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">包含檔案與工具回傳</text><path d="M592 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="618" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="653" cy="188" r="20" fill="#294d3e"/><text x="653" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">3</text><text x="638" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">辦公桌｜上下文</text><text x="638" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">當次可攤開的資料</text><text x="638" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">看 context 使用率</text><text x="638" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">整理不會恢復配額</text><path d="M877 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="903" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="938" cy="188" r="20" fill="#294d3e"/><text x="938" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">4</text><text x="923" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">排班表｜額度</text><text x="923" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">本期可接的工作量</text><text x="923" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">查看已用／剩餘</text><text x="923" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">確認重設時間</text></svg>