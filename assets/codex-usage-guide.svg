<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Codex｜先查配額，再查 Token 活動</title><desc id="desc">操作路線示意，非軟體截圖。CLI 指令不等於一般 ChatGPT 聊天指令。</desc><rect width="1200" height="460" rx="24" fill="#edf1e6"/><text x="48" y="65" font-family="sans-serif" font-weight="700" font-size="32" fill="#20342f">Codex｜先查配額，再查 Token 活動</text><text x="48" y="108" font-family="sans-serif" font-size="22" fill="#5b6860">操作路線示意，非軟體截圖。CLI 指令不等於一般 ChatGPT 聊天指令。</text><rect x="48" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="83" cy="188" r="20" fill="#294d3e"/><text x="83" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">1</text><text x="68" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">先看帳號額度</text><text x="68" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">登入同一 ChatGPT</text><text x="68" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">Codex usage dashboard</text><text x="68" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">看限制、重設與 credits</text><path d="M307 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="333" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="368" cy="188" r="20" fill="#294d3e"/><text x="368" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">2</text><text x="353" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">再選模型</text><text x="353" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">點目前模型名稱</text><text x="353" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">選模型與推理強度</text><text x="353" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">CLI：/model</text><path d="M592 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="618" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="653" cy="188" r="20" fill="#294d3e"/><text x="653" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">3</text><text x="638" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">觀測資料量</text><text x="638" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">桌面：Settings → Profile</text><text x="638" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">CLI：/status</text><text x="638" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">/statusline 選顯示項目</text><path d="M877 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="903" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="938" cy="188" r="20" fill="#294d3e"/><text x="938" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">4</text><text x="923" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">分清兩種帳目</text><text x="923" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">Token 活動 ≠ 剩餘額度</text><text x="923" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">API：Platform Usage</text><text x="923" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">月費與 API 分開看</text></svg>