<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">員工之訓練：把成功方法，變成可重複的教材</title><desc id="desc">Skill 是工作手冊與參考材料，不是重新訓練模型參數。</desc><rect width="1200" height="460" rx="24" fill="#edf1e6"/><text x="48" y="65" font-family="sans-serif" font-weight="700" font-size="32" fill="#20342f">員工之訓練：把成功方法，變成可重複的教材</text><text x="48" y="108" font-family="sans-serif" font-size="22" fill="#5b6860">Skill 是工作手冊與參考材料，不是重新訓練模型參數。</text><rect x="48" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="83" cy="188" r="20" fill="#294d3e"/><text x="83" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">1</text><text x="68" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">示範與整理</text><text x="68" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">先完成一個小作品</text><text x="68" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">保留成功方法</text><text x="68" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">寫清楚完成標準</text><path d="M307 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="333" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="368" cy="188" r="20" fill="#294d3e"/><text x="368" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">2</text><text x="353" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">製作教材</text><text x="353" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">核心是 SKILL.md</text><text x="353" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">寫用途、步驟、驗收</text><text x="353" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">範本與資料可另附</text><path d="M592 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="618" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="653" cy="188" r="20" fill="#294d3e"/><text x="653" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">3</text><text x="638" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">放入並呼叫</text><text x="638" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">確認工具支援位置</text><text x="638" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">先用本機專案範圍</text><text x="638" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">指定名稱測試載入</text><path d="M877 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="903" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="938" cy="188" r="20" fill="#294d3e"/><text x="938" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">4</text><text x="923" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">驗收與修訂</text><text x="923" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">換一組素材試做</text><text x="923" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">不合格就調整教材</text><text x="923" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">保留版本，下次再用</text></svg>