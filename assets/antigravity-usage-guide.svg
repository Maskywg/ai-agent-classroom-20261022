<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Antigravity｜從模型選單與設定開始</title><desc id="desc">操作路線示意，非軟體截圖。可用選項依安裝版本與方案不同。</desc><rect width="1200" height="460" rx="24" fill="#edf1e6"/><text x="48" y="65" font-family="sans-serif" font-weight="700" font-size="32" fill="#20342f">Antigravity｜從模型選單與設定開始</text><text x="48" y="108" font-family="sans-serif" font-size="22" fill="#5b6860">操作路線示意，非軟體截圖。可用選項依安裝版本與方案不同。</text><rect x="48" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="83" cy="188" r="20" fill="#294d3e"/><text x="83" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">1</text><text x="68" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">先選模型</text><text x="68" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">對話輸入框下方</text><text x="68" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">開啟 model selector</text><text x="68" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">看帳號可用清單</text><path d="M307 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="333" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="368" cy="188" r="20" fill="#294d3e"/><text x="368" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">2</text><text x="353" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">查模型配額</text><text x="353" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">View Usage（若提供）</text><text x="353" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">或 Settings 看 quota</text><text x="353" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">看 Remaining 與重設</text><path d="M592 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="618" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="653" cy="188" r="20" fill="#294d3e"/><text x="653" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">3</text><text x="638" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">觀測資料量</text><text x="638" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">Antigravity CLI</text><text x="638" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">/usage 或 /quota</text><text x="638" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">/context 看上下文</text><path d="M877 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="903" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="938" cy="188" r="20" fill="#294d3e"/><text x="938" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">4</text><text x="923" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">查看額外預算</text><text x="923" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">Settings 檢查 overages</text><text x="923" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">Never：不自動用 credits</text><text x="923" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">Always：可能使用 credits</text></svg>