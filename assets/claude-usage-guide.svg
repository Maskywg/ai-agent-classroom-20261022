<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Claude Code｜模型、額度與 Token 到哪裡看</title><desc id="desc">操作路線示意，非軟體截圖。桌面、網站與 CLI 請分開操作。</desc><rect width="1200" height="460" rx="24" fill="#edf1e6"/><text x="48" y="65" font-family="sans-serif" font-weight="700" font-size="32" fill="#20342f">Claude Code｜模型、額度與 Token 到哪裡看</text><text x="48" y="108" font-family="sans-serif" font-size="22" fill="#5b6860">操作路線示意，非軟體截圖。桌面、網站與 CLI 請分開操作。</text><rect x="48" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="83" cy="188" r="20" fill="#294d3e"/><text x="83" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">1</text><text x="68" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">先看帳號額度</text><text x="68" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">瀏覽器登入 Claude</text><text x="68" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">Settings → Usage</text><text x="68" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">查看限制與重設</text><path d="M307 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="333" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="368" cy="188" r="20" fill="#294d3e"/><text x="368" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">2</text><text x="353" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">再選模型</text><text x="353" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">桌面：Code 模型選單</text><text x="353" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">CLI：/model</text><text x="353" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">選帳號可用的模型</text><path d="M592 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="618" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="653" cy="188" r="20" fill="#294d3e"/><text x="653" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">3</text><text x="638" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">觀測資料量</text><text x="638" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">Claude Code CLI</text><text x="638" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">/usage 看可用統計</text><text x="638" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">/context 看上下文</text><path d="M877 280h17m-7-7 7 7-7 7" fill="none" stroke="#d46336" stroke-width="3"/><rect x="903" y="150" width="252" height="260" rx="16" fill="#fff" stroke="#c4cebd"/><circle cx="938" cy="188" r="20" fill="#294d3e"/><text x="938" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">4</text><text x="923" y="244" font-family="sans-serif" font-weight="700" font-size="25" fill="#20342f">核對計費方式</text><text x="923" y="286" font-family="sans-serif" font-size="21" fill="#5b6860">訂閱：方案用量頁</text><text x="923" y="320" font-family="sans-serif" font-size="21" fill="#5b6860">API：Console Usage</text><text x="923" y="354" font-family="sans-serif" font-size="21" fill="#5b6860">估算成本不等於帳單</text></svg>